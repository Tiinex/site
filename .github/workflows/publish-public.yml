name: Publish public site

on:
  workflow_dispatch:
  push:
    branches:
      - refactor

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-refactor
  cancel-in-progress: false

jobs:
  build-public:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate source
        run: npm run validate

      - name: Portable CLI smoke
        run: npm run portable:smoke

      - name: UI shape guard
        run: npm run ui:shape

      - name: Typecheck
        run: npm run typecheck

      - name: Runtime smoke
        run: npm run runtime:smoke

      - name: UC-001 workflow
        run: npm run usecase:uc001

      - name: Storage scan
        run: npm run storage:scan

      - name: Metrics diagnostics
        run: npm run metrics
        continue-on-error: true

      - name: Build public site
        run: npm run build:public

      - name: Check public output
        run: npm run public:check

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .site-publish

  deploy-public:
    needs: build-public
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
