name: Publish public site

on:
  workflow_dispatch:
  push:
    branches: [ master, main ]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Validate source
        run: |
          npm run validate
          npm run build:public
          npm run public:check
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .site-publish
  deploy:
    needs: build
    if: github.repository_owner == 'Tiinex'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
  skip-deploy:
    needs: build
    if: github.repository_owner != 'Tiinex'
    runs-on: ubuntu-latest
    steps:
      - run: echo "Skipping deploy outside Tiinex owner; build succeeded."
