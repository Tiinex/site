name: Tiinex Site Public

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate-build-mirror:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Validate source, UI shape, use-cases, and public bundle
        run: npm test

      - name: Metrics and storage scan
        run: |
          npm run metrics
          npm run storage:scan

      - name: Build bundled public output
        run: npm run build:public

      - name: Mirror bundled public output to public branch
        if: ${{ github.event_name != 'pull_request' }}
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: public
          publish_dir: ./.site-publish
          force_orphan: true

      - name: Optional external mirror hint
        if: ${{ vars.TIINEX_EXTRA_MIRROR_NOTE != '' }}
        run: echo "${{ vars.TIINEX_EXTRA_MIRROR_NOTE }}"
